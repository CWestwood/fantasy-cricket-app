name: Live Match Sync and Points Allocation

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes

jobs:
  sync-and-allocate-points:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SPORTSMONKS_API_KEY: ${{ secrets.SPORTSMONKS_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if we're in a match window
        id: check-match
        run: python3 server/check_match_status.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run sportsmonkLiveMatchData.js
        if: steps.check-match.outputs.in_match_window == 'true'
        run: node sportsmonkLiveMatchData.js

      - name: Run live_score_update.js
        if: steps.check-match.outputs.in_match_window == 'true'
        run: node live_score_update.js
